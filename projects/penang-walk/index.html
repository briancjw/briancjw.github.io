<style>
  :root { --text: #f5f0e8; --muted: #c9c2b6; --accent: #f2d67c; }
  * { box-sizing: border-box; }

  .stick-ghost { position: absolute; left: 34px; bottom: 34px; width: 110px; height: 110px; border-radius: 50%; border: 2px dashed rgba(255,255,255,.28); display: grid; place-items: center; font-size: 11px; color: rgba(255,255,255,.55); }
  body:not(.touch) .stick-ghost, body.moved .stick-ghost { display: none; }

  .loading.done { opacity: 0; pointer-events: none; }
  body.still .ui { display: none; }

  .gate { position: absolute; left: 50%; top: 42%; translate: -50% -50%; padding: 12px 22px; border-radius: 999px; background: var(--accent); color: #1E2A5A;

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { OutlineEffect } from 'three/addons/effects/OutlineEffect.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* =========================================================
   阿夜游槟城：第三人称小游戏
   一条老街：北边一排店屋、中间马路、南边一排店屋，两边都有五脚基走廊
   ========================================================= */
const C = { navy: 0x1E2A5A, amber: 0xF5B83D, teal: 0x3FB6A8, pink: 0xF28DA0, cream: 0xF4ECDD };
const G = 0.26;                          // 五脚基地面高度
const ROAD_Y = .07;
const NORTH_CURB = 2.3, SOUTH_CURB = 10.2;   // 马路两边的路沿（z）
const SOUTH_Z = 12.6;                        // 南边那排店屋镜像过去的位置
const X_MIN = -31, X_MAX = 31;
const STILL = new URLSearchParams(location.search).has('still');
/* 画风：默认二次元卡通描边；?real=1 换回普通写实版 */
const TOON = !new URLSearchParams(location.search).has('real');
/* 卡通分层：暗部不压太黑，画面保持适中亮度 */
const toonGrad = new THREE.DataTexture(new Uint8Array([120, 185, 235, 255]), 4, 1, THREE.RedFormat);
toonGrad.minFilter = toonGrad.magFilter = THREE.NearestFilter;
toonGrad.needsUpdate = true;
if (STILL) document.body.classList.add('still');
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const touch = document.body.classList.contains('touch');
const rand = (a, b) => a + Math.random() * (b - a);

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: STILL });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, touch ? 1.5 : 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.fog = new THREE.Fog(0x1c2350, 30, 95);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 400);

/* ---------- 小工具 ---------- */
const glows = [];
const nightLights = [];
function mat(color, o = {}) {
  const m = TOON
    ? new THREE.MeshToonMaterial({ color, gradientMap: toonGrad, map: o.map || null, transparent: !!o.t, opacity: o.op ?? 1, side: o.side ?? THREE.FrontSide, fog: o.fog ?? true })
    : new THREE.MeshStandardMaterial({
      color, roughness: o.r ?? 0.8, metalness: o.m ?? 0, flatShading: !!o.flat,
      map: o.map || null, transparent: !!o.t, opacity: o.op ?? 1, side: o.side ?? THREE.FrontSide, fog: o.fog ?? true
    });
  if (o.em !== undefined) {
    m.emissive = new THREE.Color(o.em);
    m.emissiveIntensity = o.ei ?? 1;
    if (o.emMap) m.emissiveMap = o.emMap;
    glows.push({ m, base: m.emissiveIntensity, day: o.dayEi ?? m.emissiveIntensity * 0.12 });
  }
  m.envMapIntensity = o.env ?? 0.5;
  return m;
}
function add(parent, geo, m, x = 0, y = 0, z = 0, shadow = true) {
  const mesh = new THREE.Mesh(geo, m);
  mesh.position.set(x, y, z);
  mesh.castShadow = shadow;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}
const box = (p, w, h, d, m, x, y, z, s) => add(p, new THREE.BoxGeometry(w, h, d), m, x, y, z, s);
const cyl = (p, rt, rb, h, m, x, y, z, seg = 16, s) => add(p, new THREE.CylinderGeometry(rt, rb, h, seg), m, x, y, z, s);
function lamp(color, intensity, distance, x, y, z) {
  const l = new THREE.PointLight(color, intensity, distance, 2);
  l.position.set(x, y, z);
  scene.add(l);
  nightLights.push({ light: l, base: intensity });
  return l;
}
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
/* 娘惹花砖 */
function drawTile(ctx, s) {
  ctx.fillStyle = '#F4ECDD'; ctx.fillRect(0, 0, s, s);
  ctx.fillStyle = '#3FB6A8'; ctx.fillRect(s * .05, s * .05, s * .9, s * .9);
  ctx.fillStyle = '#F4ECDD';
  ctx.beginPath(); ctx.moveTo(s / 2, s * .13); ctx.lineTo(s * .87, s / 2); ctx.lineTo(s / 2, s * .87); ctx.lineTo(s * .13, s / 2); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#F28DA0';
  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI / 2;
    ctx.beginPath(); ctx.ellipse(s / 2 + Math.cos(a) * s * .14, s / 2 + Math.sin(a) * s * .14, s * .12, s * .07, a, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = '#F5B83D'; ctx.beginPath(); ctx.arc(s / 2, s / 2, s * .055, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1E2A5A';
  [[0, 0], [s, 0], [0, s], [s, s]].forEach(([x, y]) => { ctx.beginPath(); ctx.arc(x, y, s * .15, 0, Math.PI * 2); ctx.fill(); });
}
const tileTex = (rx, ry) => canvasTex(128, 128, (c, w) => drawTile(c, w), [rx, ry]);
function signTex(main, sub, bg, fg, w = 1024, h = 256) {
  return canvasTex(w, h, (c) => {
    c.fillStyle = bg; c.fillRect(0, 0, w, h);

function makeShophouse(x0, w, wall, shutter, signMain, signSub, south, open) {
  const g = new THREE.Group();

    box(g, 1.3, .5, .1, winGlow, cx, G + 3.0, -2.56, false);
    [-1, 1].forEach(s => {
      box(g, 1.5, 1.5, .1, winGlow, cx + s * w * .3, G + 1.7, -2.56, false);
      box(g, 1.7, .14, .2, cream, cx + s * w * .3, G + 2.52, -2.5);
      box(g, 1.7, .14, .2, cream, cx + s * w * .3, G + .9, -2.5);
    });
  }
  const pillarXs = [lx0 + .35, cx, lx0 + w - .35];
  pillarXs.forEach(x => {
    box(g, .55, 3.9, .55, mat(wall, { r: .7 }), x, G + 1.95, -.5);
    box(g, .7, .25, .7, cream, x, G + .12, -.5);
    box(g, .7, .25, .7, cream, x, G + 3.8, -.5);
  });
  box(g, w, .38, .32, cream, cx, G + 4.1, -.08);
  const st = signTex(signMain, signSub, '#1E2A5A', '#F5B83D');
  const signFace = mat(0xffffff, { map: st, r: .5, em: 0xffffff, emMap: st, ei: .7, dayEi: .05 });
  box(g, w * .62, .62, .1, [cream, cream, cream, cream, signFace, cream], cx, G + 4.66, -.06);
  for (let i = 0; i < 3; i++) {
    const wx = lx0 + w * (i + .5) / 3;
    box(g, 1.4, 2.2, .16, cream, wx, G + 6.2, -.14);
    box(g, 1.05, 1.9, .12, winGlow, wx, G + 6.18, -.1, false);
    box(g, 1.7, .2, .4, cream, wx, G + 7.42, -.08);
    [-1, 1].forEach(s => {
      const sh = box(g, .52, 1.9, .07, shut, wx + s * .8, G + 6.18, .12);
      sh.rotation.y = s * .55;
    });
    /* 窗台花箱 */
    box(g, 1.5, .18, .45, wood, wx, G + 5.12, .1);
    for (let k = 0; k < 5; k++) add(g, new THREE.IcosahedronGeometry(rand(.13, .22), 0), flowerPick(), wx + rand(-.6, .6), G + 5.32 + rand(-.02, .12), .16 + rand(0, .16), false);
  }
  for (let i = 0; i <= 3; i++) box(g, .24, 3.6, .14, cream, lx0 + w * i / 3, G + 5.85, -.13);
  box(g, w + .2, .36, .55, cream, cx, G + 7.86, -.1);
  const shape = new THREE.Shape([new THREE.Vector2(7.95, 0), new THREE.Vector2(-.65, 0), new THREE.Vector2(3.6, 2.05)]);
  const roof = add(g, new THREE.ExtrudeGeometry(shape, { depth: w, bevelEnabled: false }), roofMat, lx0, G + 8.04, 0);
  roof.rotation.y = Math.PI / 2;
  box(g, w, .16, .3, mat(0x8f3b28, { r: .8 }), cx, G + 10.1, -3.6);
  const roofY = G + 8.04;
  [[.6, 0, -3.6, 2.05], [-7.95, 0, -3.6, 2.05]].forEach(([z0, y0, z1, y1]) => {
    const dz = z1 - z0, dy = y1 - y0, len = Math.hypot(dz, dy);
    const nz = -dy / len * Math.sign(dz), ny = Math.abs(dz) / len;
    const angle = Math.atan2(dy, -dz);
    const rows = 8;
    for (let k = 0; k < rows; k++) {
      const t = (k + .5) / rows;
      const row = box(g, w + .1, .07, len / rows * .9, k % 2 ? tileA : tileB, cx, roofY + y0 + dy * t + ny * .05, z0 + dz * t + nz * .05, false);
      row.rotation.x = angle;

  });

  /* ---- 生活细节 ---- */
  /* 一楼窗户的铁窗花；有些店拉下半截卷闸门 */
  const halfShutter = Math.random() < .4 ? (Math.random() < .5 ? -1 : 1) : 0;
  if (!open) [-1, 1].forEach(s => {
    const wx = cx + s * w * .3;
    for (let k = -2; k <= 2; k++) box(g, .045, 1.5, .045, iron, wx + k * .3, G + 1.7, -2.46, false);
    [1.25, 2.15].forEach(y => box(g, 1.5, .045, .045, iron, wx, G + y, -2.46, false));
    if (s === halfShutter) {
      box(g, 1.7, .9, .08, shutterMat, wx, G + 2.05, -2.4, false);
      box(g, 1.8, .16, .2, iron, wx, G + 2.55, -2.42, false);
    }
  });
  /* 冷气机挂在二楼外墙 */
  [0, 2].forEach(i => {
    if (Math.random() < .35) return;
    const ax = lx0 + w * (i + .5) / 3 + (i ? .2 : -.2);
    box(g, .72, .46, .34, [acSide, acSide, acSide, acSide, acFront, acSide], ax, G + 4.62, .1);
    box(g, .04, .04, .4, iron, ax - .2, G + 4.37, .1, false);
    box(g, .04, .04, .4, iron, ax + .2, G + 4.37, .1, false);
  });
  /* 直招牌：从二楼伸出来，从街上两个方向都看得到 */
  const pair = VSIGN_COLORS[Math.floor(Math.random() * VSIGN_COLORS.length)];
  const vt = vertSignTex(signMain.slice(0, 2), pair[0], pair[1]);
  const vFace = mat(0xffffff, { map: vt, em: 0xffffff, emMap: vt, ei: .55, dayEi: .03, r: .5 });
  const vEdge = mat(new THREE.Color(pair[0]).getHex(), { r: .5 });
  const vx = lx0 + w - .35;
  box(g, .12, 1.9, .8, [vFace, vFace, vEdge, vEdge, vEdge, vEdge], vx, G + 5.95, .62, true);
  box(g, .05, .05, .9, iron, vx, G + 6.95, .5, false);
  box(g, .05, .05, .9, iron, vx, G + 4.95, .5, false);
  /* 柱子上贴的海报 */
  add(g, new THREE.PlaneGeometry(.42, .6), mat(0xffffff, { map: posterTexs[Math.floor(Math.random() * posterTexs.length)], r: .9 }), cx, G + 1.65, -.215, false);
  if (Math.random() < .5) add(g, new THREE.PlaneGeometry(.42, .6), mat(0xffffff, { map: posterTexs[Math.floor(Math.random() * posterTexs.length)], r: .9 }), lx0 + .35, G + 1.5, -.215, false);
  /* 晒衣竿：中间窗户伸出竹竿，挂几件衣服 */
  if (Math.random() < .55) {
    const pole2 = cyl(g, .025, .025, 1.3, mat(0xC9A86A, { r: .7 }), cx + .3, G + 7.15, .5, 6, false);
    pole2.rotation.x = Math.PI / 2;
    const n = 2 + Math.floor(Math.random() * 3);
    for (let k = 0; k < n; k++) {
      const cloth = box(g, rand(.28, .4), rand(.38, .55), .03, CLOTHES[Math.floor(Math.random() * CLOTHES.length)], cx + .3, G + 6.85, .05 + k * .3, true);
      cloth.rotation.y = Math.PI / 2;
      cloth.userData.sway = Math.random() * 6;
      clothes.push(cloth);
    }
  }

  /* 碰撞：一楼墙面、柱子；镜头：整栋楼和二楼挑出来的部分 */
  const toWorldZ = z => south ? SOUTH_Z - z : z;
  const za = toWorldZ(-9), zb = toWorldZ(-2.6);
  if (!open) colliders.push({ x0, x1: x0 + w, z0: Math.min(za, zb), z1: Math.max(za, zb) });
  pillarXs.forEach(px => {
    const wx = south ? -px : px, pz = toWorldZ(-.5);
    colliders.push({ x0: wx - .3, x1: wx + .3, z0: pz - .3, z1: pz + .3 });
    camBlocks.push({ x0: wx - .42, x1: wx + .42, y0: 0, y1: G + 4, z0: pz - .42, z1: pz + .42 });
  });
  camBlocks.push({ x0, x1: x0 + w, y0: open ? G + 3.9 : -1, y1: 12, z0: Math.min(za, zb), z1: Math.max(za, zb) });
  const oa = toWorldZ(-9), ob = toWorldZ(-.05);
  camBlocks.push({ x0, x1: x0 + w, y0: G + 3.95, y1: 12, z0: Math.min(oa, ob), z1: Math.max(oa, ob) });
  return g;
}

  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(p[0], p[1], p[2])));
  for (let k = 0; k < count; k++) {
    const p = curve.getPoint(k / (count - 1));
    add(world, new THREE.IcosahedronGeometry(rand(.13, .3), 0), Math.random() < .3 ? leaf : (Math.random() < .5 ? blossom : bloom), p.x + rand(-.22, .22), p.y + rand(-.18, .18), p.z + rand(-.15, .15), false);
  }
}

  g.rotation.y = a + Math.PI;
  g.scale.setScalar(1.08);
  tea.add(g);
  const furM = mat(o.fur, { r: .6 });
  const whiteM = mat(0xF7F1E6, { r: .6 });
  const shirtM = o.shirt ? mat(o.shirt, { r: .7 }) : furM;
  const bodyMesh = add(g, new THREE.LatheGeometry(bodyProfile, 24), shirtM, 0, 0, 0);
  bodyMesh.scale.z = .9;
  [-1, 1].forEach(s => {
    const leg = new THREE.Group(); leg.position.set(s * .15, .3, 0); leg.rotation.x = -1.45; g.add(leg);
    add(leg, new THREE.CapsuleGeometry(.09, .1, 4, 10), furM, 0, -.08, 0);

    add(arm, new THREE.CapsuleGeometry(.065, .16, 4, 10), furM, 0, -.15, 0);
    add(arm, new THREE.SphereGeometry(.08, 12, 10), whiteM, 0, -.28, .02);
  });
  const hd = new THREE.Group(); hd.position.set(0, 1.2, .02); g.add(hd);
  add(hd, new THREE.SphereGeometry(.42, 24, 18), furM);
  [-1, 1].forEach(s => {
    const ear = add(hd, new THREE.ConeGeometry(.15, .3, 14), furM, s * .25, .33, -.02);
    ear.rotation.z = -s * .32;
    const inner = add(ear, new THREE.ConeGeometry(.09, .2, 10), pinkM, 0, -.03, .06, false); inner.scale.z = .45;

    }
    const ck = add(hd, new THREE.SphereGeometry(.055, 10, 8), pinkM, s * .26, -.09, .32, false); ck.scale.set(1, .55, .3);
    const m = add(hd, new THREE.SphereGeometry(.07, 12, 10), whiteM, s * .05, -.115, .36, false); m.scale.set(1, .8, .7);
  });
  const ns = add(hd, new THREE.SphereGeometry(.028, 10, 8), pinkM, 0, -.07, .41, false); ns.scale.set(1.3, .8, .8);
  /* 尾巴垂在椅子后面 */

  add(g, new THREE.TubeGeometry(tc, 12, .05, 8), furM);

    add(hd, new THREE.SphereGeometry(.035, 8, 6), mat(o.bow, { r: .5 }), .2, .36, .05, false);

const R_PLAYER = .38;
function collide(p) {
  for (let pass = 0; pass < 2; pass++) {

          const out = [[p.x - b.x0, -1, 0], [b.x1 - p.x, 1, 0], [p.z - b.z0, 0, -1], [b.z1 - p.z, 0, 1]].sort((a, c) => a[0] - c[0])[0];

  inK += ((insideTea(player.position) ? 1 : 0) - inK) * (snap ? 1 : Math.min(1, dt * 3));
  const maxD = THREE.MathUtils.lerp(camState.dist, Math.min(camState.dist, 3.3), inK);

let orderTimers = [];
const tableFood = [];
let lastOrder = [], pendingOrder = null;
function placeOrder(ids) {
  closeMenu();

  bossServe = .7;
  const names = ids.map(fname).join(L('、', ', '));
  say(L(`好嘞！${names}～请先找个位子坐，马上端过去！`, `Got it: ${names}! Find a seat and I’ll bring it over.`), BOSS_HEAD, 3.2);
  toast(L('找一张空椅子坐下，菜就会端上来', 'Sit on an empty chair and your food will arrive'), 3.2);

function serveToSeat(c) {
  const ids = pendingOrder;
  pendingOrder = null;
  orderTimers.forEach(clearTimeout);
  orderTimers = [];
  tableFood.forEach(g => scene.remove(g));
  tableFood.length = 0;
  lastOrder = ids.slice();
  /* 菜摆在阿夜面前：靠她那一侧排一排，多于 3 样再往桌子中间排第二排 */
  const a = c.rot - Math.PI;
  const ux = Math.sin(a), uz = Math.cos(a);       // 桌心 → 椅子的方向
  const px = Math.cos(a), pz = -Math.sin(a);      // 和它垂直，左右排开
  const n = ids.length;
  ids.forEach((id, i) => {
    const row = i < 3 ? 0 : 1, inRow = row ? n - 3 : Math.min(n, 3), k = row ? i - 3 : i;
    const side = (k - (inRow - 1) / 2) * .21;
    const fwd = row ? .02 : .26;
    orderTimers.push(setTimeout(() => {
      if (seated !== c) return;
      const g = serve(id, new THREE.Vector3(c.table.x + ux * fwd + px * side, G + .806, c.table.z + uz * fwd + pz * side), .9, 99);
      tableFood.push(g);
      served.splice(served.indexOf(g), 1);
      const first = taste(id, true);
      ding(first ? [988, 1318] : [880]);
      hopT = .3;
      if (i === n - 1) {
        const done = tasted.size === FOOD_TOTAL;
        toast(done ? L('8 样美食全部尝过了！阿夜吃得好饱～', 'All 8 treats tasted! Malam is happily full~')
          : L(`上齐了！慢慢吃，也可以拍照打卡  (${tasted.size}/${FOOD_TOTAL})`, `All served! Enjoy, and snap a check-in  (${tasted.size}/${FOOD_TOTAL})`), 3.2);
        say(L('菜上齐咯，慢慢吃！', 'All served, enjoy!'), BOSS_HEAD, 2);
      }
    }, 700 + i * 650));
  });
}

let bossServe = 0;
function updateInteract(dt) {
  /* 找最近的可互动对象；坐着时只有「起身」 */
  near = null;
  if (seated) {
    standItem.anchor.set(player.position.x, player.position.y + 2.1, player.position.z);
    near = standItem;
  } else if (!busy()) {
    let best = Infinity;
    interactables.forEach(it => {
      const px = player.position.x, pz = player.position.z;
      const d = it.box
        ? Math.hypot(px - THREE.MathUtils.clamp(px, it.box.x0, it.box.x1), pz - THREE.MathUtils.clamp(pz, it.box.z0, it.box.z1))
        : Math.hypot(px - it.at.x, pz - it.at.z) + (it.chair ? .15 : 0);
      if (d < it.r + (it.chair ? .15 : 0) && d < best) { best = d; near = it; }
    });
  }
  if (near) {
    ui.promptText.textContent = near.label();
    /* 提示挂在目标上方；看不到目标时（镜头太近、被挡出画面）就改挂在阿夜头上 */
    let vis = toScreen(near.anchor, ui.prompt);
    if (!vis) {
      headAnchor.set(player.position.x, player.position.y + 2.3, player.position.z);
      vis = toScreen(headAnchor, ui.prompt);
    }
    if (!vis) {
      /* 两个都在画面外：固定在画面下方中间，保证一定看得到 */
      ui.prompt.style.left = '50%';
      ui.prompt.style.top = (innerHeight * .78) + 'px';
    }
    ui.prompt.classList.toggle('on', bubbleT <= 0 && !busy());
    ui.act.textContent = near === standItem ? L('起身', 'Stand') : L('互动', 'Use');
    ui.act.classList.toggle('on', !busy());
  } else {
    ui.prompt.classList.remove('on');
    ui.act.classList.remove('on');
  }
  if (bubbleT > 0) {
    bubbleT -= dt;
    toScreen(bubbleAt, ui.bubble);
    if (bubbleT <= 0) ui.bubble.classList.remove('on');
  }
  /* 上菜弹出来 */
  const popIn = g => {
    if (g.userData.pop >= 1) return;
    g.userData.pop = Math.min(1, g.userData.pop + dt * 3);
    const q = g.userData.pop - 1;
    g.scale.setScalar(Math.max(.01, 1 + 2.2 * q * q * q + 1.2 * q * q) * g.userData.size);   // 弹一下再停住
  };
  served.forEach(popIn);
  tableFood.forEach(popIn);
  /* 老板端菜时身体往前倾一下 */
  if (bossServe > 0) bossServe = Math.max(0, bossServe - dt);
  boss.rotation.x = Math.sin(Math.min(1, (.7 - bossServe) / .7) * Math.PI) * .18 * (bossServe > 0 ? 1 : 0);
  if (wokBoost > 0) wokBoost = Math.max(0, wokBoost - dt);
  if (hopT > 0) hopT = Math.max(0, hopT - dt);
}

  if (POSE === 'street') { player.position.set(-9.5, G, 4.6); player.rotation.y = Math.PI; }
  if (POSE === 'menu' || POSE === 'served' || POSE === 'sit' || POSE === 'card') {
    player.position.set(-13.6, G, -5.35); player.rotation.y = Math.PI; hatK = 0; setHat(0);
    if (POSE === 'menu') setTimeout(() => { openMenu(); togglePick('tehtarik'); togglePick('nasilemak'); togglePick('roti'); }, 600);
    else {
      setTimeout(() => placeOrder(['tehtarik', 'nasilemak', 'roti', 'eggs']), 300);
      if (POSE !== 'served') setTimeout(() => sit(teaChairs.find(c => c.table.x === -13.7 && Math.abs(c.rot - Math.PI / 2) < .01) || teaChairs[0]), 4200);
      if (POSE === 'card') setTimeout(snap, 6000);
    }
  }
  camState.yaw = camState.yawT = -Math.PI / 2 + .35; camState.pitch = camState.pitchT = .12; camState.dist = camState.distT = 3.1;
  if (['tea', 'door', 'street', 'menu', 'served', 'sit', 'card'].includes(POSE)) {
    camState.yaw = camState.yawT = player.rotation.y + Math.PI + (POSE === 'street' ? -.5 : POSE === 'door' ? .55 : 0);
    camState.pitch = camState.pitchT = POSE === 'street' ? .32 : .22;
    camState.dist = camState.distT = POSE === 'street' ? 8 : 4.2;
  }
  document.getElementById('help').style.display = 'none';
}

/* ---------- 每一帧 ---------- */
const clock = new THREE.Clock();
const vel = new THREE.Vector3();
const move = new THREE.Vector3();
const tailTip = new THREE.Vector3();
let walkPhase = 0, moveK = 0, helped = false, frames = 0, sitK = 0;
skyReady = true;
applyDay(0);
setRain(true);
placeCamera(0, true);
moon.position.set(player.position.x + 60, 70, -120);

function frame(_, testDt) {
  const dt = testDt ?? Math.min(clock.getDelta(), .05);
  const t = clock.elapsedTime;
  const motion = calm ? 0 : 1;

  /* 日夜过渡 */
  if (Math.abs(dayTarget - dayK) > .001) {
    dayK += Math.sign(dayTarget - dayK) * Math.min(Math.abs(dayTarget - dayK), dt * .9);
    applyDay(dayK);
  }
  const night = 1 - dayK;
  nightLights.forEach(n => { n.light.intensity = n.base * (.06 + .94 * night); });
  wetK += ((raining ? 1 : 0) - wetK) * Math.min(1, dt * 2);
  reflections.forEach((r, i) => { r.material.opacity = .5 * night * wetK * (.9 + Math.sin(t * 2 + i) * .1); });

  /* 走路：输入方向跟着镜头转 */
  let ix = (keys.r ? 1 : 0) - (keys.l ? 1 : 0) + stick.x;
  let iz = (keys.f ? 1 : 0) - (keys.b ? 1 : 0) - stick.y;
  if (busy()) { ix = 0; iz = 0; }
  /* 坐着的时候一按方向键就站起来 */
  if (seated) {
    if (Math.hypot(ix, iz) > .3) standUp();
    else { ix = 0; iz = 0; }
  }
  const mag = Math.min(1, Math.hypot(ix, iz));
  const running = keys.run || (stick.id !== null && Math.hypot(stick.x, stick.y) > .92);
  const speed = (running ? 6.2 : 3.2) * mag;
  if (mag > .05) {
    const fx = -Math.sin(camState.yaw), fz = -Math.cos(camState.yaw);
    move.set(fx * iz + (-fz) * ix, 0, fz * iz + fx * ix).normalize().multiplyScalar(speed);
    if (!helped) { helped = true; setTimeout(() => document.getElementById('help').classList.add('hide'), 600); }
  } else move.set(0, 0, 0);
  vel.lerp(move, 1 - Math.exp(-dt * 10));
  if (!seated) {
    player.position.x += vel.x * dt;
    player.position.z += vel.z * dt;
    collide(player.position);
    player.position.y += (floorY(player.position.z) - player.position.y) * Math.min(1, dt * 14);
  } else vel.set(0, 0, 0);
  const sp = Math.hypot(vel.x, vel.z);
  if (sp > .2) {
    const want = Math.atan2(vel.x, vel.z);
    let diff = want - player.rotation.y;
    diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    player.rotation.y += diff * Math.min(1, dt * 12);
    /* 往前走时，镜头慢慢转到阿夜身后（拖动视角时不抢） */
    if (!look && iz > .3) {
      let back = player.rotation.y + Math.PI - camState.yawT;
      back = Math.atan2(Math.sin(back), Math.cos(back));
      camState.yawT += back * Math.min(1, dt * 1.1);
    }
  }

  /* 走路动画：腿脚前后摆、身体上下晃；停下来时呼吸、东张西望 */
  moveK += (Math.min(1, sp / 3.2) - moveK) * Math.min(1, dt * 8);
  walkPhase += dt * (4 + sp * 2.2) * motion;
  const swing = Math.sin(walkPhase) * .75 * moveK;
  legL.rotation.x = swing; legR.rotation.x = -swing;
  armL.rotation.x = -swing * .8;
  armR.rotation.x = swing * .8;
  rig.position.y = Math.abs(Math.sin(walkPhase)) * .07 * moveK + Math.sin((1 - hopT / .55) * Math.PI) * .32 * (hopT > 0 ? 1 : 0);
  rig.rotation.x = .08 * moveK * (sp > 4 ? 1.6 : 1);
  body.scale.y = 1 + Math.sin(t * 2.2) * .02 * motion * (1 - moveK);
  head.position.y = 1.2 + Math.sin(walkPhase * 2) * .015 * moveK;
  head.rotation.y = Math.sin(t * .6) * .3 * motion * (1 - moveK);
  /* 尾巴：只是很慢、很轻地晃一下，不跟着走路甩 */
  tail.rotation.y = Math.sin(t * .7) * .06 * motion;
  ears.forEach((e, i) => { e.rotation.x = (Math.sin(t * 7 + i) > .97 ? -.35 : 0) * motion; });
  /* 坐姿：腿往前伸、双手搭在桌上，头轻轻晃 */
  sitK += ((seated ? 1 : 0) - sitK) * Math.min(1, dt * 8);
  if (sitK > .01) {
    legL.rotation.x = THREE.MathUtils.lerp(legL.rotation.x, -1.45, sitK);
    legR.rotation.x = THREE.MathUtils.lerp(legR.rotation.x, -1.45, sitK);
    armL.rotation.x = THREE.MathUtils.lerp(armL.rotation.x, -1.05, sitK);
    armR.rotation.x = THREE.MathUtils.lerp(armR.rotation.x, -1.05, sitK);
    head.rotation.z = Math.sin(t * 1.4) * .06 * sitK * motion;
  } else head.rotation.z = 0;

  /* 小雨帽：在雨里、又没有屋檐时展开；进到走廊下收成小花苞 */
  const wantHat = raining && !covered(player.position.x, player.position.z) ? 1 : 0;
  if (Math.abs(wantHat - hatK) > .001) {
    hatK += Math.sign(wantHat - hatK) * Math.min(Math.abs(wantHat - hatK), dt * 2.4);
    setHat(hatK);
  }

  tailLantern.getWorldPosition(tailTip);
  catLight.position.copy(tailTip);

  /* 锅气、火 */
  const flick = .8 + Math.random() * .4;
  const boost = 1 + wokBoost * 1.4;          // 点炒粿条时火一下子窜高
  flame.scale.set(boost, flick * boost * 1.3 - (boost - 1) * .3, boost);
  wokLight.intensity = 10 * flick * boost * (.2 + .8 * night);
  steam.forEach(s => {
    const d = s.userData;
    d.life += dt * .42 * (motion || .2);
    if (d.life > 1) d.life -= 1;
    const L = d.life;
    s.position.set(d.origin.x + Math.sin(t * 1.3 + d.seed) * d.spread * (1 + L * 2), d.origin.y + L * 1.5 * d.size, d.origin.z + Math.cos(t + d.seed) * d.spread);
    s.scale.setScalar((.25 + L * .8) * d.size);
    s.material.opacity = Math.sin(L * Math.PI) * (.28 + .1 * dayK);
  });
  lanterns.forEach((l, i) => { l.rotation.z = Math.sin(t * 1.3 + i) * .05 * motion; });
  clothes.forEach(c => { c.rotation.z = Math.sin(t * 1.6 + c.userData.sway) * .12 * motion; });
  /* 茶室：吊扇慢慢转，老板轻轻点头 */
  teaFans.forEach(f => { f.rotation.y += dt * 3 * (motion || .3); });
  bossHead.rotation.z = Math.sin(t * 1.1) * .07 * motion;
  customers.forEach(c => { c.hd.rotation.z = Math.sin(t * .8 + c.seed) * .06 * motion; c.hd.rotation.x = (Math.sin(t * .5 + c.seed) * .5 + .5) * .12 * motion; });
  boss.position.y = G + Math.abs(Math.sin(t * 1.1)) * .02 * motion;
  komtarTop.visible = (t % 1.6) < .9;

  /* 雨跟着阿夜 */
  if (raining) {
    const px = player.position.x, pz = player.position.z;
    for (let i = 0; i < RAIN; i++) {
      const o = i * 6;
      const dy = rainSpeed[i] * dt * (motion || .4);
      rainPos[o + 1] -= dy; rainPos[o + 4] -= dy;
      rainPos[o] -= dt * .8; rainPos[o + 3] -= dt * .8;
      const fy = roofAt(rainPos[o], rainPos[o + 2]);
      if (rainPos[o + 1] < fy || Math.abs(rainPos[o] - px) > RAIN_R + 2 || Math.abs(rainPos[o + 2] - pz) > RAIN_R + 2) {
        if (rainPos[o + 1] < fy && fy < 1 && Math.random() < .08) spawnRipple(rainPos[o], fy, rainPos[o + 2]);
        dropAt(i, true);
      }
    }
    rainGeo.attributes.position.needsUpdate = true;
  }
  ripples.forEach(r => {
    if (r.userData.life >= 1) { r.material.opacity = 0; return; }
    r.userData.life += dt * 1.6;
    const L = r.userData.life;
    r.scale.setScalar(1 + L * 5);
    r.material.opacity = (1 - L) * .55;
  });

  /* 阴影跟着阿夜 */
  sky.position.set(player.position.x - 16, 28, player.position.z + 14);
  sky.target.position.set(player.position.x, 0, player.position.z);
  moon.position.set(camera.position.x + 60, camera.position.y + 70, camera.position.z - 120);

  placeCamera(dt, false);
  updateInteract(dt);
  render();
  if (++frames === 3) {
    const ld = document.getElementById('loading');
    ld.classList.add('done');
    setTimeout(() => ld.remove(), 900);
    window.__ready = true;
    /* 载入好就把键盘焦点给画面；嵌在别的网页里拿不到焦点时，显示“点一下画面” */
    canvas.focus({ preventScroll: true });
    syncGate();
  }
}
const inFrame = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
const gateEl = document.getElementById('gate');
function syncGate() { gateEl.classList.toggle('on', inFrame && !STILL && !document.hasFocus()); }
window.addEventListener('focus', syncGate);
window.addEventListener('blur', syncGate);
canvas.addEventListener('focus', syncGate);
renderer.setAnimationLoop(frame);
window.__game = { player, camState, colliders, step: frame, hat, setHat, camera, camBlocks, near: () => near, doInteract, placeOrder, togglePick, sit, standUp, snap, teaChairs, tasted, tableFood, isMenuOpen: () => menuOpen, isSeated: () => !!seated };
</script>
</body>
</html>
