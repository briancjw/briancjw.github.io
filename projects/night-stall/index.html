<style>
  :root { --text: #f5f0e8; --muted: #b9b2a6; --accent: #f2d67c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1030; color: var(--text); font-family: "DM Sans", "Noto Sans SC", "Microsoft YaHei", sans-serif; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; outline: none; }
  canvas.dragging { cursor: grabbing; }
  .ui { position: fixed; inset: 0; pointer-events: none; }
  .title { position: absolute; left: 22px; top: 18px; text-shadow: 0 2px 12px rgba(0,0,0,.4); }
  .title small { display: block; font-size: 11px; letter-spacing: .26em; color: var(--accent); }
  .title b { display: block; margin-top: 5px; font-size: 20px; font-weight: 600; }
  .hint { position: absolute; right: 22px; top: 22px; font-size: 12px; color: var(--muted); text-shadow: 0 2px 10px rgba(0,0,0,.5); }
  .bar {
    position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 4px; padding: 5px;
    border-radius: 999px; background: rgba(14, 13, 12, .5); border: 1px solid rgba(255, 255, 255, .14);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); pointer-events: auto;
  }
  .bar button {
    border: 0; border-radius: 999px; padding: 8px 14px; background: transparent; color: var(--text);
    font: inherit; font-size: 13px; white-space: nowrap; cursor: pointer; transition: background .25s, color .25s;
  }
  .bar button:hover { background: rgba(255, 255, 255, .12); }
  .bar button[aria-pressed="true"] { background: var(--text); color: #141210; }
  .bar button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .bubble {
    position: absolute; left: 0; top: 0; padding: 8px 12px; border-radius: 14px 14px 14px 4px;
    background: #fff; color: #1E2A5A; font-size: 13px; font-weight: 600; white-space: nowrap;
    box-shadow: 0 8px 24px rgba(0,0,0,.25); opacity: 0; transform-origin: 0 100%;
    transition: opacity .2s, scale .35s cubic-bezier(.34,1.56,.64,1); scale: .6;
  }
  .bubble.show { opacity: 1; scale: 1; }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; background: #0b1030; color: var(--muted); font-size: 13px; transition: opacity .7s; }
  .loading.done { opacity: 0; pointer-events: none; }
  body.still .ui { display: none; }
  @media (max-width: 600px) {
    .hint { display: none; }
    .title b { font-size: 16px; }
    .bar button { padding: 7px 9px; font-size: 12px; }
  }
</style>

  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

<body>
<canvas id="c" tabindex="0" aria-label="可以拖动旋转的 3D 场景：槟城老店屋转角的炒粿条夜宵摊，阿夜坐在桌边吃宵夜"></canvas>
<div class="ui">
  <div class="title"><small>MALAM'S NIGHT STALL · 3D</small><b>阿夜的槟城夜宵摊</b></div>
  <div class="hint">拖动旋转 · 滚轮缩放 · 点一下阿夜和小摊</div>
  <div class="bar" role="toolbar" aria-label="场景控制">
    <button type="button" id="btnDay" aria-pressed="false">切换白天</button>

<script>
  /* 网址带 ?lang=en 时换成英文界面（作品集英文版会这样打开） */
  window.EN = /[?&]lang=en\b/.test(location.search);
  if (window.EN) {
    document.documentElement.lang = 'en';
    document.title = 'Malam\'s Penang Supper Stall · Interactive 3D';
    document.getElementById('c').setAttribute('aria-label', 'A 3D scene you can drag to rotate: a char koay teow supper stall on an old Penang shophouse corner, with Malam eating at a table');
    document.querySelector('.title b').textContent = 'Malam\'s Penang Supper Stall';
    document.querySelector('.hint').textContent = 'Drag to rotate · Scroll to zoom · Click Malam and the stall';
    document.querySelector('.bar').setAttribute('aria-label', 'Scene controls');
    document.getElementById('btnDay').textContent = 'Daytime';
    document.getElementById('btnRain').textContent = 'Rain';
    document.getElementById('btnSpin').textContent = 'Auto-rotate';
    document.getElementById('btnReset').textContent = 'Reset view';
    document.getElementById('loading').textContent = 'Building the night street…';
  }
  /* 3D 库要联网加载，太久没好就给出提示 */
  setTimeout(function () {
    if (!window.__ready) document.getElementById('loading').textContent = window.EN ? 'The 3D scene needs an internet connection. Please check your network and refresh.' : '3D 场景需要联网加载，请检查网络后刷新页面。';
  }, 15000);
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ---------- 基本设定 ---------- */
const C = { navy: 0x1E2A5A, amber: 0xF5B83D, teal: 0x3FB6A8, pink: 0xF28DA0, cream: 0xF4ECDD };
const G = 0.26;                                   // 五脚基（骑楼走廊）地面高度
const STILL = new URLSearchParams(location.search).has('still');   // 截封面图用
if (STILL) document.body.classList.add('still');
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand = (a, b) => a + Math.random() * (b - a);

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: STILL });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 400);
const HOME = { pos: new THREE.Vector3(24.5, 14.2, 27.5), target: new THREE.Vector3(0.8, 2.5, -0.6) };
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 8;
controls.maxDistance = 70;
controls.minPolarAngle = 0.3;
controls.maxPolarAngle = 1.36;
controls.autoRotateSpeed = 0.55;
window.__view = (x, y, z, tx, ty, tz) => { camera.position.set(x, y, z); controls.target.set(tx, ty, tz); controls.update(); };

/* ---------- 小工具 ---------- */
const glows = [];          // 夜里会亮的材质：{ m, base }
const nightLights = [];    // 夜里会亮的灯：{ light, base }
function mat(color, o = {}) {
  const m = new THREE.MeshStandardMaterial({
    color, roughness: o.r ?? 0.8, metalness: o.m ?? 0, flatShading: !!o.flat,
    map: o.map || null, transparent: !!o.t, opacity: o.op ?? 1, side: o.side ?? THREE.FrontSide
  });
  if (o.em !== undefined) {
    m.emissive = new THREE.Color(o.em);
    m.emissiveIntensity = o.ei ?? 1;
    if (o.emMap) m.emissiveMap = o.emMap;
    glows.push({ m, base: m.emissiveIntensity, day: o.dayEi ?? m.emissiveIntensity * 0.12 });
  }
  m.envMapIntensity = o.env ?? 0.5;
  return m;
}
function add(parent, geo, m, x = 0, y = 0, z = 0, shadow = true) {
  const mesh = new THREE.Mesh(geo, m);
  mesh.position.set(x, y, z);
  mesh.castShadow = shadow;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}
const box = (p, w, h, d, m, x, y, z, s) => add(p, new THREE.BoxGeometry(w, h, d), m, x, y, z, s);
const cyl = (p, rt, rb, h, m, x, y, z, seg = 16, s) => add(p, new THREE.CylinderGeometry(rt, rb, h, seg), m, x, y, z, s);
function lamp(color, intensity, distance, x, y, z) {
  const l = new THREE.PointLight(color, intensity, distance, 2);
  l.position.set(x, y, z);
  scene.add(l);
  nightLights.push({ light: l, base: intensity });
  return l;
}

/* ---------- 画布贴图 ---------- */
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
/* 娘惹花砖：青绿底、粉色四瓣花、四角深蓝 */
function drawTile(ctx, s) {
  ctx.fillStyle = '#F4ECDD'; ctx.fillRect(0, 0, s, s);
  ctx.fillStyle = '#3FB6A8'; ctx.fillRect(s * .05, s * .05, s * .9, s * .9);
  ctx.fillStyle = '#F4ECDD';
  ctx.beginPath(); ctx.moveTo(s / 2, s * .13); ctx.lineTo(s * .87, s / 2); ctx.lineTo(s / 2, s * .87); ctx.lineTo(s * .13, s / 2); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#F28DA0';
  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI / 2;
    ctx.beginPath(); ctx.ellipse(s / 2 + Math.cos(a) * s * .14, s / 2 + Math.sin(a) * s * .14, s * .12, s * .07, a, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = '#F5B83D'; ctx.beginPath(); ctx.arc(s / 2, s / 2, s * .055, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1E2A5A';
  [[0, 0], [s, 0], [0, s], [s, s]].forEach(([x, y]) => { ctx.beginPath(); ctx.arc(x, y, s * .15, 0, Math.PI * 2); ctx.fill(); });
}
const tileTex = (rx, ry) => canvasTex(128, 128, (c, w) => drawTile(c, w), [rx, ry]);
function signTex(main, sub, bg, fg, w = 1024, h = 256) {
  return canvasTex(w, h, (c) => {
    c.fillStyle = bg; c.fillRect(0, 0, w, h);
    c.strokeStyle = fg; c.lineWidth = 9; c.strokeRect(16, 16, w - 32, h - 32);
    c.fillStyle = fg; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.font = `700 ${sub ? h * .42 : h * .5}px "Microsoft YaHei", "Noto Sans SC", sans-serif`;
    c.fillText(main, w / 2, sub ? h * .42 : h / 2);
    if (sub) { c.font = `600 ${h * .15}px "Segoe UI", Arial, sans-serif`; c.fillText(sub, w / 2, h * .78); }
  });
}
const stripeTex = (n, a, b) => canvasTex(256, 64, (c, w, h) => {
  for (let i = 0; i < n; i++) { c.fillStyle = i % 2 ? a : b; c.fillRect(i * w / n, 0, w / n + 1, h); }
});
const softDot = canvasTex(64, 64, (c) => {
  const g = c.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,.9)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = g; c.fillRect(0, 0, 64, 64);
});

/* ---------- 天空 ---------- */
const skyCanvas = document.createElement('canvas');
skyCanvas.width = 4; skyCanvas.height = 256;
const skyCtx = skyCanvas.getContext('2d');
const skyTex = new THREE.CanvasTexture(skyCanvas);
skyTex.colorSpace = THREE.SRGBColorSpace;
scene.background = skyTex;
function paintSky(top, mid, bottom) {
  const g = skyCtx.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, top); g.addColorStop(.55, mid); g.addColorStop(1, bottom);
  skyCtx.fillStyle = g; skyCtx.fillRect(0, 0, 4, 256);
  skyTex.needsUpdate = true;
}
const starGeo = new THREE.BufferGeometry();
const starPts = [];
for (let i = 0; i < 500; i++) {
  const a = rand(0, Math.PI * 2), e = rand(.15, 1.3), r = 150;
  starPts.push(Math.cos(a) * Math.cos(e) * r, Math.sin(e) * r, Math.sin(a) * Math.cos(e) * r);
}
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPts, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, sizeAttenuation: false, transparent: true, opacity: .8, depthWrite: false }));
scene.add(stars);
const moonTex = canvasTex(256, 256, (c) => {
  const g = c.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0, 'rgba(255,248,220,1)'); g.addColorStop(.28, 'rgba(255,240,200,1)');
  g.addColorStop(.31, 'rgba(255,225,170,.35)'); g.addColorStop(1, 'rgba(255,210,150,0)');
  c.fillStyle = g; c.fillRect(0, 0, 256, 256);
});
const moon = new THREE.Sprite(new THREE.SpriteMaterial({ map: moonTex, transparent: true, depthWrite: false, fog: false }));
moon.position.set(-60, 55, -110);
moon.scale.setScalar(34);
scene.add(moon);

/* ---------- 灯光 ---------- */
const hemi = new THREE.HemisphereLight(0x3a4c8c, 0x140f1c, .55);
scene.add(hemi);
const sky = new THREE.DirectionalLight(0x9fb2ff, .8);
sky.position.set(-16, 26, 14);
sky.castShadow = true;
sky.shadow.mapSize.set(2048, 2048);
Object.assign(sky.shadow.camera, { left: -17, right: 17, top: 17, bottom: -17, near: 1, far: 80 });
sky.shadow.bias = -0.0004;
sky.shadow.normalBias = 0.03;
scene.add(sky);

/* ---------- 底座与街道 ---------- */
const world = new THREE.Group();
scene.add(world);
const sideA = tileTex(13, 1), sideB = tileTex(17, 1);
const baseTop = mat(0x171b2f, { r: .9 });
const baseMats = [mat(0xffffff, { map: sideA, r: .7 }), mat(0xffffff, { map: sideA, r: .7 }), baseTop, baseTop, mat(0xffffff, { map: sideB, r: .7 }), mat(0xffffff, { map: sideB, r: .7 })];
const base = new THREE.Mesh(new THREE.BoxGeometry(24, 1.4, 18), baseMats);
base.position.y = -.7;
base.receiveShadow = true;
world.add(base);
box(world, 24.4, .2, 18.4, mat(C.navy, { r: .5 }), 0, -1.5, 0, false);
/* 底座正面的铭牌 */
const plateTex = signTex('阿夜的槟城夜宵摊', "MALAM'S NIGHT STALL · GEORGE TOWN", '#1E2A5A', '#F5B83D', 1024, 200);
const plate = box(world, 6.4, 1.05, .06, [0, 0, 0, 0, 0, 0].map((_, i) => i === 4 ? mat(0xffffff, { map: plateTex, r: .4, m: .2 }) : mat(0xD9A441, { r: .35, m: .6 })), 0, -.72, 9.03, false);

const roadMat = mat(0x22263a, { r: .22, m: .3, env: 1.1 });
box(world, 23.7, .06, 6.4, roadMat, 0, .03, 5.6, false);
const paint = mat(0xEDE6D6, { r: .6 });
for (let x = -10.5; x <= 10.5; x += 2.6) box(world, 1.4, .02, .14, paint, x, .07, 6.1, false);
for (let i = 0; i < 6; i++) box(world, 2.2, .02, .5, paint, -6.2, .07, 3.0 + i * .95, false);
box(world, 23.7, .3, .32, mat(0xcfc6b4, { r: .7 }), 0, .15, 2.3);
const walkMat = mat(0xffffff, { map: tileTex(20, 4), r: .4, env: .9 });
box(world, 23.7, .26, 4.75, walkMat, 0, .13, -.27, false);
box(world, 3.9, .2, 6.3, mat(0x3b3d48, { r: .9 }), 9.9, .1, -5.8, false);

/* ---------- 店屋 ---------- */
const cream = mat(C.cream, { r: .75 });
const wood = mat(0x5a3a26, { r: .7 });
const roofMat = mat(0xB9533A, { r: .85, flat: true });
const winGlow = mat(0x5a4632, { r: .35, em: 0xffa64d, ei: .9, dayEi: .03, env: .9 });
const lanterns = [];

function makeLantern(parent, x, y, z, s = 1, glow = 2.2) {
  const g = new THREE.Group();
  g.position.set(x, y, z);
  g.scale.setScalar(s);
  parent.add(g);
  const pts = [[0, -.34], [.18, -.32], [.29, -.18], [.33, 0], [.29, .18], [.18, .32], [0, .34]].map(p => new THREE.Vector2(p[0], p[1]));
  add(g, new THREE.LatheGeometry(pts, 20), mat(0xD8432F, { r: .5, em: 0xff5a26, ei: glow, dayEi: .1 }), 0, 0, 0, false);
  const gold = mat(0xD9A441, { r: .35, m: .6 });
  cyl(g, .15, .15, .07, gold, 0, .36, 0, 16, false);
  cyl(g, .15, .15, .07, gold, 0, -.36, 0, 16, false);
  cyl(g, .012, .012, .55, mat(0x111111), 0, .66, 0, 6, false);
  cyl(g, .03, .06, .26, mat(0xC8302A, { r: .6 }), 0, -.53, 0, 8, false);
  lanterns.push(g);
  return g;
}

function makeShophouse(x0, w, wall, shutter, signMain, signSub) {
  const g = new THREE.Group();
  world.add(g);
  const cx = x0 + w / 2;
  const wallMat = mat(wall, { r: .82 });
  const shut = mat(shutter, { r: .6 });
  /* 一楼与二楼 */
  box(g, w, 3.9, 5.2, wallMat, cx, G + 1.95, -5.2);
  box(g, w, 3.8, 7.6, wallMat, cx, G + 5.8, -4.0);
  /* 一楼门面：木门、发光的窗 */
  box(g, 1.7, 2.7, .14, wood, cx, G + 1.35, -2.56);
  box(g, 1.3, .5, .1, winGlow, cx, G + 3.0, -2.56, false);
  [-1, 1].forEach(s => {
    box(g, 1.5, 1.5, .1, winGlow, cx + s * w * .3, G + 1.7, -2.56, false);
    box(g, 1.7, .14, .2, cream, cx + s * w * .3, G + 2.52, -2.5);
    box(g, 1.7, .14, .2, cream, cx + s * w * .3, G + .9, -2.5);
  });
  /* 骑楼柱子与横梁 */
  [x0 + .35, cx, x0 + w - .35].forEach(x => {
    box(g, .55, 3.9, .55, mat(wall, { r: .7 }), x, G + 1.95, -.5);
    box(g, .7, .25, .7, cream, x, G + .12, -.5);
    box(g, .7, .25, .7, cream, x, G + 3.8, -.5);
  });
  box(g, w, .38, .32, cream, cx, G + 4.1, -.08);
  /* 招牌 */
  const st = signTex(signMain, signSub, '#1E2A5A', '#F5B83D');
  const signFace = mat(0xffffff, { map: st, r: .5, em: 0xffffff, emMap: st, ei: .7, dayEi: .05 });
  box(g, w * .62, .62, .1, [cream, cream, cream, cream, signFace, cream], cx, G + 4.66, -.06);
  /* 二楼的长窗、百叶窗、壁柱 */
  const n = 3;
  for (let i = 0; i < n; i++) {
    const wx = x0 + w * (i + .5) / n;
    box(g, 1.4, 2.2, .16, cream, wx, G + 6.2, -.14);
    box(g, 1.05, 1.9, .12, winGlow, wx, G + 6.18, -.1, false);
    box(g, 1.7, .2, .4, cream, wx, G + 7.42, -.08);
    [-1, 1].forEach(s => {
      const sh = box(g, .52, 1.9, .07, shut, wx + s * .8, G + 6.18, .12);
      sh.rotation.y = s * .55;
      for (let k = 0; k < 5; k++) box(sh, .46, .04, .1, mat(shutter, { r: .5 }), 0, -.74 + k * .37, .02, false);
    });
  }
  for (let i = 0; i <= n; i++) box(g, .24, 3.6, .14, cream, x0 + w * i / n, G + 5.85, -.13);
  /* 屋檐线脚与屋顶 */
  box(g, w + .2, .36, .55, cream, cx, G + 7.86, -.1);
  const shape = new THREE.Shape([new THREE.Vector2(7.95, 0), new THREE.Vector2(-.65, 0), new THREE.Vector2(3.6, 2.05)]);
  const roof = add(g, new THREE.ExtrudeGeometry(shape, { depth: w, bevelEnabled: false }), roofMat, x0, G + 8.04, 0);
  roof.rotation.y = Math.PI / 2;
  box(g, w, .16, .3, mat(0x8f3b28, { r: .8 }), cx, G + 10.1, -3.6);
  /* 一排排瓦片：沿着前后两面斜坡铺上横条，看起来像真的红瓦屋顶 */
  const tileA = mat(0xA9442F, { r: .7, flat: true }), tileB = mat(0xC4583D, { r: .7, flat: true });
  const roofY = G + 8.04;
  [[.6, 0, -3.6, 2.05], [-7.95, 0, -3.6, 2.05]].forEach(([z0, y0, z1, y1]) => {
    const dz = z1 - z0, dy = y1 - y0, len = Math.hypot(dz, dy);
    const nz = -dy / len * Math.sign(dz), ny = Math.abs(dz) / len;
    const angle = Math.atan2(dy, -dz);
    const rows = 12;
    for (let k = 0; k < rows; k++) {
      const t = (k + .5) / rows;
      const row = box(g, w + .1, .07, len / rows * .9, k % 2 ? tileA : tileB,
        cx, roofY + y0 + dy * t + ny * .05, z0 + dz * t + nz * .05, false);
      row.rotation.x = angle;
    }

  roadMat.roughness = on ? .1 : .75;
  roadMat.metalness = on ? .5 : .15;
  walkMat.roughness = on ? .32 : .8;
  if (!on) ripples.forEach(r => { r.userData.life = 1; r.material.opacity = 0; });
}

/* ---------- 尺寸 ---------- */
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  composer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
function resetView() {
  const aspect = window.innerWidth / Math.max(1, window.innerHeight);
  const far = THREE.MathUtils.clamp(1.6 / aspect, 1, 1.9);
  camera.position.copy(HOME.target).add(HOME.pos.clone().sub(HOME.target).multiplyScalar(far));
  controls.target.copy(HOME.target);
  controls.update();
}
window.addEventListener('resize', () => { resize(); });
resize();
resetView();

/* ---------- 点击互动 ---------- */
const bubble = document.getElementById('bubble');
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const LINES = window.EN ? {
  cat: ['Meow! This plate is mine', 'That\'s my third plate tonight…', 'Rain can\'t stop supper', 'Come explore Penang at night with me'],
  stall: ['Char koay teow, RM 7.50', 'Add an egg?', 'Enough wok hei?']
} : {
  cat: ['喵！这盘炒粿条是我的', '今晚吃第三盘了…', '下雨也挡不住宵夜', '跟我一起夜游槟城吧'],
  stall: ['炒粿条一份 RM 7.50', '要加蛋吗？', '锅气够不够？']
};
const lineIndex = { cat: 0, stall: 0 };
cat.userData.kind = 'cat';
stall.userData.kind = 'stall';
let bubbleTimer = 0, bubbleAnchor = null, catJump = 1;
function kindOf(obj) {
  for (let o = obj; o; o = o.parent) if (o.userData.kind) return o.userData.kind;
  return null;
}
let downAt = null;
canvas.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; canvas.classList.add('dragging'); });
window.addEventListener('pointerup', e => {
  canvas.classList.remove('dragging');
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) { downAt = null; return; }
  downAt = null;
  const rect = canvas.getBoundingClientRect();
  ndc.set((e.clientX - rect.left) / rect.width * 2 - 1, -(e.clientY - rect.top) / rect.height * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObjects([cat, stall], true)[0];
  if (!hit) return;
  const kind = kindOf(hit.object);
  const list = LINES[kind];
  bubble.textContent = list[lineIndex[kind]++ % list.length];
  bubbleAnchor = kind === 'cat' ? new THREE.Vector3(T.x + .3, G + 2.2, T.z - 1.0) : new THREE.Vector3(3.2 + 1, G + 3.0, 1.6);
  bubble.classList.add('show');
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => { bubble.classList.remove('show'); }, 2200);
  if (kind === 'cat') catJump = 0;
});
const proj = new THREE.Vector3();
function placeBubble() {
  if (!bubbleAnchor) return;
  proj.copy(bubbleAnchor).project(camera);
  const rect = canvas.getBoundingClientRect();
  bubble.style.transform = `translate(${(proj.x + 1) / 2 * rect.width}px, ${(1 - proj.y) / 2 * rect.height - 40}px)`;
}

/* ---------- 按钮 ---------- */
const btnDay = document.getElementById('btnDay');
const btnRain = document.getElementById('btnRain');
const btnSpin = document.getElementById('btnSpin');
btnDay.addEventListener('click', () => {
  dayTarget = dayTarget ? 0 : 1;
  btnDay.textContent = window.EN ? (dayTarget ? 'Night-time' : 'Daytime') : (dayTarget ? '切换夜晚' : '切换白天');
  /* 晚上下雨，白天放晴；之后仍然可以用“下雨”按钮自己开关 */
  setRain(dayTarget === 0);
  btnRain.setAttribute('aria-pressed', String(raining));
});
btnRain.addEventListener('click', () => {
  setRain(!raining);
  btnRain.setAttribute('aria-pressed', String(raining));
});
btnSpin.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  btnSpin.setAttribute('aria-pressed', String(controls.autoRotate));
});
document.getElementById('btnReset').addEventListener('click', resetView);

/* ---------- 动画 ---------- */
const clock = new THREE.Clock();
const tailTip = new THREE.Vector3();
applyDay(0);
setRain(true);
let frames = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), .05);
  const t = clock.elapsedTime;
  const motion = calm ? 0 : 1;

  if (Math.abs(dayTarget - dayK) > .001) {
    dayK += Math.sign(dayTarget - dayK) * Math.min(Math.abs(dayTarget - dayK), dt * .9);
    applyDay(dayK);
  }
  const night = 1 - dayK;
  nightLights.forEach(n => { n.light.intensity = n.base * (.06 + .94 * night); });
  wetK += ((raining ? 1 : 0) - wetK) * Math.min(1, dt * 2);
  reflections.forEach((r, i) => { r.material.opacity = .5 * night * wetK * (.9 + Math.sin(t * 2 + i) * .1); });

  /* 锅里的火和锅气 */
  const flick = .8 + Math.random() * .4;
  flame.scale.set(1, flick, 1);
  wokLight.intensity = 10 * flick * (.2 + .8 * night);
  steam.forEach((s, i) => {
    const d = s.userData;
    d.life += dt * .42 * (motion || .2);
    if (d.life > 1) d.life -= 1;
    const L = d.life;
    s.position.set(d.origin.x + Math.sin(t * 1.3 + d.seed) * d.spread * (1 + L * 2), d.origin.y + L * 1.5, d.origin.z + Math.cos(t + d.seed) * d.spread);
    s.scale.setScalar(.25 + L * .8);
    s.material.opacity = Math.sin(L * Math.PI) * (.28 + .1 * dayK);
  });

  /* 灯笼轻轻摆 */
  lanterns.forEach((l, i) => { l.rotation.z = Math.sin(t * 1.3 + i) * .05 * motion; });

  /* 阿夜：呼吸、转头、摇尾巴、偶尔抖耳朵，被点到会跳一下 */
  catBody.scale.y = 1.04 + Math.sin(t * 2.2) * .02 * motion;
  head.rotation.y = Math.sin(t * .6) * .3 * motion;
  head.rotation.z = Math.sin(t * .9) * .06 * motion;
  tail.rotation.y = Math.sin(t * 1.5) * .35 * motion;
  ears.forEach((e, i) => { e.rotation.x = (Math.sin(t * 7 + i) > .97 ? -.35 : 0) * motion; });
  if (catJump < 1) {
    catJump = Math.min(1, catJump + dt * 2.2);
    cat.position.y = G + .5 + Math.sin(catJump * Math.PI) * .55;
  }
  tailLantern.getWorldPosition(tailTip);
  catLight.position.copy(tailTip);

  /* 雨 */
  if (raining) {
    for (let i = 0; i < RAIN; i++) {
      const o = i * 6;
      const dy = rainSpeed[i] * dt * (motion || .4);
      rainPos[o + 1] -= dy; rainPos[o + 4] -= dy;
      rainPos[o] -= dt * .8; rainPos[o + 3] -= dt * .8;
      const fy = floorAt(rainPos[o], rainPos[o + 2]);
      if (rainPos[o + 1] < fy) {
        if (fy < 1 && Math.random() < .08) spawnRipple(rainPos[o], fy, rainPos[o + 2]);
        dropAt(i, true);
      }
    }
    rainGeo.attributes.position.needsUpdate = true;
  }
  ripples.forEach(r => {
    if (r.userData.life >= 1) { r.material.opacity = 0; return; }
    r.userData.life += dt * 1.6;
    const L = r.userData.life;
    r.scale.setScalar(1 + L * 5);
    r.material.opacity = (1 - L) * .55;
  });

  controls.update();
  placeBubble();
  composer.render();
  if (++frames === 3) {
    document.getElementById('loading').classList.add('done');
    window.__ready = true;
  }
}
renderer.setAnimationLoop(frame);
</script>
</body>
</html>
