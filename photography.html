<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>摄影 · 暗房 | Brian Chew</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<meta property="og:type" content="website">
<meta property="og:title" content="摄影 · 暗房 | Brian Chew">
<meta property="og:description" content="Brian Chew 的作品集：摄影、平面设计、影像和 Vibe Coding。USM 新媒体与设计在读。">
<meta property="og:url" content="https://briancjw.github.io/photography.html">

<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/transition.js"></script>
<style>
  /* 暗房：一开始整页泡在红色安全灯里，往下滑灯慢慢熄掉，变成展厅 */
  :root { --red: #c8261b; --paper: #efe8dc; --serif: "Cormorant Garamond", "Noto Serif SC", serif; }
  body { background: linear-gradient(#170504 0, #170504 85vh, #0e0d0c 175vh); }
  .safelight {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(60vw 50vh at 88% -10%, rgba(220, 40, 25, .42), transparent 70%),
      radial-gradient(40vw 40vh at 10% 110%, rgba(150, 20, 12, .25), transparent 70%);
  }
  main, footer { position: relative; z-index: 1; }

  /* ---------- 首屏 ---------- */
  .hero { position: relative; min-height: 100vh; display: grid; grid-template-columns: 1fr 1.1fr; align-items: center; gap: 40px; padding: 120px var(--gutter) 70px; }
  .kicker { margin: 0 0 18px; font-size: 13px; letter-spacing: .22em; color: #ff8a73; }
  .kicker i { display: inline-block; width: 8px; height: 8px; margin-right: 10px; border-radius: 50%; background: #ff3b24; box-shadow: 0 0 12px 3px rgba(255, 59, 36, .7); vertical-align: 1px; animation: hum 3.2s ease-in-out infinite; }
  @keyframes hum { 50% { opacity: .55; box-shadow: 0 0 6px 1px rgba(255, 59, 36, .5); } }
  h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 210px; line-height: .86; letter-spacing: .01em; color: #f3d9cf; }
  html[lang="en"] h1 { font-size: 116px; }
  .hero-line { max-width: 440px; margin: 26px 0 0; font-family: var(--serif); font-style: italic; font-size: 26px; line-height: 1.45; color: #e9c6bb; }
  html[lang="zh-CN"] .hero-line { font-style: normal; font-size: 21px; letter-spacing: .02em; }
  .hero-hint { display: inline-flex; align-items: center; gap: 12px; margin-top: 46px; font-size: 13px; letter-spacing: .08em; color: #b9877c; }
  .hero-hint::before { content: ""; width: 1px; height: 40px; background: linear-gradient(transparent, #ff6a52); animation: drip 2.4s ease-in-out infinite; }
  @keyframes drip { 0% { transform: scaleY(0); transform-origin: top; } 50% { transform: scaleY(1); transform-origin: top; } 51% { transform-origin: bottom; } 100% { transform: scaleY(0); transform-origin: bottom; } }

  /* 印样（contact sheet）：三条底片，每格可以用红色蜡笔圈起来 */
  .sheet { position: relative; padding: 26px 26px 22px; background: #0b0807; border-radius: 3px; rotate: -2.2deg; box-shadow: 0 40px 80px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .04); }
  .sheet-head { display: flex; justify-content: space-between; margin-bottom: 12px; font-family: "Courier New", monospace; font-size: 11px; letter-spacing: .12em; color: #d07a3a; }
  .strip { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 22px 8px 18px; margin-bottom: 10px; background: #1a1210; }
  .strip:last-child { margin-bottom: 0; }
  /* 齿孔 */
  .strip::before, .strip::after { content: ""; position: absolute; left: 6px; right: 6px; height: 6px; background: repeating-linear-gradient(90deg, transparent 0 7px, #0b0807 7px 15px, transparent 15px 22px); }
  .strip::before { top: 12px; } .strip::after { bottom: 5px; }
  /* 片边字：印在齿孔外侧 */
  .edge { position: absolute; top: 2px; left: 12px; right: 12px; display: flex; justify-content: space-between; font-family: "Courier New", monospace; font-size: 7.5px; line-height: 9px; letter-spacing: .16em; color: #e07b2c; opacity: .85; white-space: nowrap; }
  .frame { position: relative; aspect-ratio: 3 / 2; padding: 0; border: 0; background: #000; cursor: pointer; }
  .frame .clip { position: absolute; inset: 0; overflow: hidden; }
  .frame .pic { position: absolute; left: 50%; top: 50%; width: 100%; height: 100%; translate: -50% -50%; background: var(--g); filter: saturate(.85) contrast(1.05); transition: filter .5s; }
  /* 直幅照片在底片上是横躺的 */
  .frame:hover .pic { filter: none; }
  .frame .num { position: absolute; right: 4px; bottom: 2px; font-family: "Courier New", monospace; font-size: 9px; color: #e07b2c; text-shadow: 0 0 2px #000; }
  .frame svg { position: absolute; inset: -14% -10%; width: 120%; height: 128%; pointer-events: none; overflow: visible; }
  .frame svg path { fill: none; stroke: #e5321f; stroke-width: 3.2; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; opacity: .92; filter: drop-shadow(0 0 1px rgba(0,0,0,.6)); transition: stroke-dashoffset .7s cubic-bezier(.6, 0, .2, 1); }
  .frame:hover svg path, .frame.picked svg path, .frame:focus-visible svg path { stroke-dashoffset: 0; }
  .sheet-foot { display: flex; justify-content: space-between; margin-top: 12px; font-size: 12px; color: #8f6b62; }

  /* ---------- 展厅 ---------- */
  .hall { padding: 150px var(--gutter) 160px; }
  .hall-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 30px; margin-bottom: 70px; }
  .hall-head h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 64px; line-height: .9; letter-spacing: .01em; }
  .hall-head h2 small { display: block; margin-bottom: 14px; font-family: var(--body); font-size: 13px; letter-spacing: .2em; color: var(--accent); }
  /* 筛选：像底片标签 */
  .tabs { display: flex; gap: 8px; }
  .tabs button {
    position: relative; display: inline-flex; align-items: baseline; gap: 8px; padding: 10px 16px 10px 18px; border: 1px solid var(--line); border-radius: 3px;
    background: rgba(255, 255, 255, .02); font-size: 13px; cursor: pointer; transition: background .3s, color .3s, border-color .3s;
  }
  .tabs button sup { font-family: "Courier New", monospace; font-size: 10px; color: var(--muted); }
  .tabs button::before { content: ""; position: absolute; left: 6px; top: 7px; bottom: 7px; width: 3px; background: repeating-linear-gradient(transparent 0 3px, currentColor 3px 6px); opacity: .25; }
  .tabs button:hover { border-color: rgba(245, 240, 232, .35); }
  .tabs button[aria-pressed="true"] { background: var(--paper); border-color: var(--paper); color: #1a1412; }
  .tabs button[aria-pressed="true"] sup { color: #8a5a48; }

  .gallery { display: grid; grid-template-columns: repeat(12, 1fr); column-gap: 28px; row-gap: 64px; align-items: start; }
  .print { margin: 0; grid-column: var(--c); margin-top: var(--mt, 0px); }
  .gallery.filtered .print { grid-column: span 4; margin-top: 0; }
  .gallery.filtered .print.tall { grid-column: span 3; }
  .mat { position: relative; padding: 12px; background: var(--paper); box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .7), 0 2px 0 rgba(255,255,255,.04) inset; cursor: zoom-in; transition: translate .7s var(--expo), box-shadow .7s var(--expo); }
  .mat:hover { translate: 0 -6px; box-shadow: 0 46px 80px -24px rgba(0, 0, 0, .8); }
  .mat .img { aspect-ratio: var(--ar); background: var(--g); }
  /* 夹子：洗好的照片挂起来晾干 */
  .mat::before { content: ""; position: absolute; top: -12px; left: 50%; width: 26px; height: 22px; margin-left: -13px; border-radius: 3px 3px 5px 5px; background: linear-gradient(#3a3532, #1e1b19); box-shadow: 0 3px 6px rgba(0,0,0,.5); }
  .print figcaption { display: grid; grid-template-columns: 50px 1fr; gap: 2px 10px; align-items: baseline; padding: 14px 2px 0; }
  .print .no { font-family: var(--serif); font-style: italic; font-size: 15px; color: var(--muted); }
  .print b { font-family: "Noto Serif SC", serif; font-weight: 600; font-size: 15px; }
  html[lang="en"] .print b { font-family: var(--serif); font-size: 19px; font-weight: 500; }
  .print i { display: block; margin-top: 2px; font-family: var(--serif); font-size: 14px; color: var(--muted); }
  html[lang="en"] .print i { display: none; }
  .print .meta { grid-column: 2; font-size: 11px; letter-spacing: .08em; color: var(--muted); }
  .mat { padding: 9px; }

  /* ---------- 大图 ---------- */
  .lb { display: grid; grid-template-columns: minmax(0, 1fr) 300px; height: 100%; }
  .lb-stage { display: flex; align-items: center; justify-content: center; min-width: 0; padding: 60px 40px 60px 110px; }
  .lb-img { max-width: 100%; max-height: 100%; height: 82vh; aspect-ratio: var(--ar, 1.5); background: var(--g); box-shadow: 0 30px 80px rgba(0,0,0,.6); }
  .lb-info { display: flex; flex-direction: column; justify-content: flex-end; gap: 22px; padding: 100px 40px 60px 30px; border-left: 1px solid var(--line); }
  .lb-info .count { font-family: var(--display); font-size: 64px; line-height: 1; color: var(--accent); }
  .lb-info .count small { font-size: 26px; color: var(--muted); }
  .lb-info b { display: block; font-family: "Noto Serif SC", serif; font-size: 26px; font-weight: 600; }
  html[lang="en"] .lb-info b { font-family: var(--serif); font-size: 30px; font-weight: 500; }
  .lb-info i { display: block; margin-top: 4px; font-family: var(--serif); font-size: 19px; color: var(--muted); }
  html[lang="en"] .lb-info i { display: none; }
  .lb-info dl { margin: 0; display: grid; grid-template-columns: 80px 1fr; gap: 10px 12px; font-size: 13px; }
  .lb-info dt { color: var(--muted); }
  .lb-info dd { margin: 0; }
  .lb-info .hint { font-size: 12px; color: var(--muted); }
  .lb-nav { position: fixed; top: 50%; z-index: 4; width: 52px; height: 52px; margin-top: -26px; border-radius: 50%; border: 1px solid var(--line); background: rgba(255,255,255,.05); font-size: 20px; cursor: pointer; transition: background .3s, color .3s; }
  .lb-nav:hover { background: var(--text); color: var(--bg); }
  .lb-prev { left: 28px; } .lb-next { right: 330px; }

  /* ---------- 手机版 ---------- */
  @media (max-width: 760px) {
    .hero { grid-template-columns: 1fr; gap: 34px; padding: 100px 16px 50px; min-height: 0; }
    h1 { font-size: 120px; }
    html[lang="en"] h1 { font-size: 68px; }
    .hero-line, html[lang="zh-CN"] .hero-line { font-size: 18px; max-width: none; }
    .hero-hint { margin-top: 26px; }
    .sheet { padding: 14px 12px 12px; rotate: -1deg; }
    .sheet-head { font-size: 9px; }
    .strip { gap: 4px; padding: 18px 5px 14px; margin-bottom: 7px; }
    .strip::before { top: 9px; height: 5px; } .strip::after { bottom: 4px; height: 5px; }
    .edge { font-size: 5.5px; line-height: 7px; left: 8px; right: 8px; }
    .edge span:nth-child(2), .edge span:nth-child(4) { display: none; }
    .sheet-foot { flex-direction: column; gap: 4px; font-size: 11px; }
    .hall { padding: 70px 16px 90px; }
    .hall-head { flex-direction: column; align-items: flex-start; gap: 20px; margin-bottom: 40px; }
    .hall-head h2 { font-size: 52px; }
    .tabs { flex-wrap: wrap; }
    .tabs button { padding: 8px 12px 8px 16px; }
    /* 两栏，偶数张往下错开一点 */
    .gallery, .gallery.filtered { grid-template-columns: 1fr 1fr; column-gap: 12px; row-gap: 34px; }
    .print, .gallery.filtered .print, .gallery.filtered .print.tall { grid-column: auto; margin-top: 0; }
    .gallery:not(.filtered) .print:nth-child(even) { margin-top: 40px; }
    .mat { padding: 6px; }
    .mat::before { width: 18px; height: 14px; margin-left: -9px; top: -8px; }
    .print figcaption { grid-template-columns: 1fr; padding-top: 10px; }
    .print .no { font-size: 12px; }
    .print .meta { grid-column: auto; }
    .lb { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; }
    .lb-stage { padding: 70px 12px 10px; }
    .lb-img { height: auto; width: 100%; max-height: 60vh; }
    .lb-info { padding: 16px 16px 84px; border-left: 0; border-top: 1px solid var(--line); gap: 12px; }
    .lb-info .count { font-size: 40px; }
    .lb-info .hint { display: none; }
    .lb-nav { top: auto; bottom: 20px; margin-top: 0; }
    .lb-prev { left: 16px; } .lb-next { right: 16px; }
  }
</style>
</head>
<body data-page="photo" data-title-zh="摄影 · 暗房 | Brian Chew" data-title-en="Photography · Darkroom | Brian Chew">
<div class="safelight" aria-hidden="true"></div>

<main>
  <section class="hero">
    <div>
      <p class="kicker"><i></i><span data-i18n="kicker">01 · 暗房 DARKROOM</span></p>
      <h1 data-split data-i18n="title">摄影</h1>
      <p class="hero-line" data-i18n="line">在红灯下，等一张照片慢慢显影。人像、风景和静物，都是我按下快门那一刻想留住的光。</p>
      <a class="hero-hint" href="#hall" data-i18n="hint">往下滑，开灯看展</a>
    </div>
    <div class="sheet" id="sheet" aria-label="印样：九张照片的缩图">
      <div class="sheet-head"><span>STILL LIGHT 982</span><span data-i18n="sheetHead">印样 · CONTACT SHEET</span></div>
      <div id="strips"></div>
      <div class="sheet-foot"><span data-i18n="sheetTip">鼠标移到格子上，用红笔圈出来；点一下直接跳到那张</span><span>N° 01–09</span></div>
    </div>
  </section>

  <section class="hall" id="hall">
    <div class="hall-head">
      <h2><small>STILL LIGHT 982 · 09</small><span data-i18n="hallTitle">展厅</span></h2>
      <div class="tabs" id="tabs" role="group" aria-label="按主题筛选"></div>
    </div>
    <div class="gallery" id="gallery"></div>
  </section>
</main>

<dialog class="modal" id="lightbox" aria-label="照片大图">
  <button class="modal-close" type="button" data-close aria-label="关闭">×</button>
  <div class="lb">
    <div class="lb-stage" id="lbStage"><div class="lb-img" id="lbImg" role="img"></div></div>
    <div class="lb-info">
      <div class="count" id="lbCount">01<small> / 09</small></div>
      <div><b id="lbTitle"></b><i id="lbSub"></i></div>
      <dl>
        <dt data-i18n="dtTheme">主题</dt><dd id="lbTheme"></dd>
        <dt data-i18n="dtGear">器材</dt><dd>Canon EOS 550D</dd>
      </dl>
      <p class="hint" data-i18n="lbHint">← → 切换 · Esc 关闭</p>
    </div>
  </div>
  <button class="lb-nav lb-prev" type="button" id="lbPrev" aria-label="上一张">←</button>
  <button class="lb-nav lb-next" type="button" id="lbNext" aria-label="下一张">→</button>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
  window.PAGE_EN = {
    kicker: '01 · DARKROOM',
    title: 'PHOTOGRAPHY',
    line: 'Waiting under the red light for a print to appear. Portraits, landscapes and still life: the light I wanted to keep the moment I pressed the shutter.',
    hint: 'Scroll down to turn on the lights',
    sheetHead: 'CONTACT SHEET',
    sheetTip: 'Hover a frame to circle it in red; click to jump to that print',
    hallTitle: 'Exhibition',
    dtTheme: 'Theme', dtGear: 'Camera',
    lbHint: '← → to browse · Esc to close'
  };
</script>
<script src="assets/site.js"></script>
<script>
(function () {
  var all = Site.all;
  var en = function () { return Site.lang === 'en'; };
  /* c：展厅里的位置（12 栏）；mt：往下错开多少，让展墙有节奏 */
  var PHOTOS = [
    { src: 'assets/works/photo-portrait-suit.jpg', ar: 1.5, theme: 'portrait', zh: '西装人像', en: 'Suit portrait', c: '1 / 6', mt: 0 },
    { src: 'assets/works/photo-cosplay.jpg', ar: .667, theme: 'portrait', zh: 'Cosplay 外拍', en: 'Cosplay shoot', c: '6 / 9', mt: 70 },
    { src: 'assets/works/photo-island.jpg', ar: 1.41, theme: 'landscape', zh: '海岛与渔舟', en: 'Island and fishing boats', c: '9 / 13', mt: 24 },
    { src: 'assets/works/photo-portrait-street.jpg', ar: .667, theme: 'portrait', zh: '街头人像', en: 'Street portrait', c: '1 / 4', mt: 30 },
    { src: 'assets/works/photo-sunset.jpg', ar: 1.48, theme: 'landscape', zh: '海边日落', en: 'Seaside sunset', c: '4 / 9', mt: 0 },
    { src: 'assets/works/photo-blossom.jpg', ar: 1.5, theme: 'landscape', zh: '花树仰拍', en: 'Blossoms from below', c: '9 / 13', mt: 90 },
    { src: 'assets/works/photo-temple.jpg', ar: 1.51, theme: 'portrait', zh: '庙宇汉服人像', en: 'Hanfu portrait at a temple', c: '1 / 7', mt: 0 },
    { src: 'assets/works/photo-blueberries.jpg', ar: 1.5, theme: 'still', zh: '蓝莓静物', en: 'Blueberry still life', c: '7 / 10', mt: 80 },
    { src: 'assets/works/photo-latte.jpg', ar: 1.5, theme: 'still', zh: '拿铁咖啡', en: 'Latte', c: '10 / 13', mt: 20 }
  ];
  var THEMES = [
    { id: 'all', zh: '全部', en: 'All' },
    { id: 'portrait', zh: '人像', en: 'Portrait' },
    { id: 'landscape', zh: '风景', en: 'Landscape' },
    { id: 'still', zh: '静物', en: 'Still life' }
  ];
  function themeName(id) { var t = THEMES.filter(function (x) { return x.id === id; })[0]; return en() ? t.en : t.zh; }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  /* 红色蜡笔圈：每格稍微不一样，像手画的 */
  function scribble(k) {
    var j = function (n) { return (Math.sin(k * 12.9 + n * 78.2) * 43758.5 % 1) * 4; };
    return 'M ' + (12 + j(1)) + ' ' + (52 + j(2)) + ' C ' + (10 + j(3)) + ' ' + (14 + j(4)) + ', ' + (88 + j(5)) + ' ' + (6 + j(6)) + ', ' + (92 + j(7)) + ' ' + (46 + j(8)) +
      ' S ' + (40 + j(9)) + ' ' + (98 + j(1)) + ', ' + (10 + j(2)) + ' ' + (60 + j(3)) + ' S ' + (40 + j(4)) + ' ' + (4 + j(5)) + ', ' + (70 + j(6)) + ' ' + (10 + j(7));
  }

  /* ---------- 印样 ---------- */
  var stripsBox = document.getElementById('strips');
  for (var s = 0; s < 3; s++) {
    var strip = document.createElement('div');
    strip.className = 'strip';
    strip.innerHTML = '<span class="edge" aria-hidden="true"><span>▸ ' + (s * 3 + 1) + ' &nbsp;' + (s * 3 + 1) + 'A</span><span>STILL LIGHT 982</span><span>▸ ' + (s * 3 + 2) + ' &nbsp;' + (s * 3 + 2) + 'A</span><span>SAFETY FILM</span><span>▸ ' + (s * 3 + 3) + ' &nbsp;' + (s * 3 + 3) + 'A</span></span>';
    for (var k = 0; k < 3; k++) {
      var i = s * 3 + k, p = PHOTOS[i];
      var f = document.createElement('button');
      f.type = 'button';
      f.className = 'frame' + (p.ar < 1 ? ' tall' : '');
      f.dataset.i = i;
      f.innerHTML = '<span class="clip"><span class="pic" style="--g:url(' + p.src + ') center/cover"></span></span><span class="num">' + (i + 1) + '</span>' +
        '<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="' + scribble(i + 1) + '"/></svg>';
      strip.appendChild(f);
    }
    stripsBox.appendChild(strip);
  }

  /* ---------- 展厅 ---------- */
  var gallery = document.getElementById('gallery');
  PHOTOS.forEach(function (p, i) {
    var fig = document.createElement('figure');
    fig.className = 'print' + (p.ar < 1 ? ' tall' : '');
    fig.id = 'print-' + (i + 1);
    fig.dataset.i = i;
    fig.dataset.theme = p.theme;
    fig.style.setProperty('--c', p.c);
    fig.style.setProperty('--mt', p.mt + 'px');
    fig.innerHTML = '<div class="mat" tabindex="0" role="button"><div class="img" style="--ar:' + p.ar + ';--g:url(' + p.src + ') center/cover"></div></div>' +
      '<figcaption><span class="no">No. ' + pad(i + 1) + '</span><div><b></b><i></i></div><span class="meta"></span></figcaption>';
    gallery.appendChild(fig);
  });
  var prints = all('.print');
  var frames = all('.frame');
  var current = 'all';
  var tabs = document.getElementById('tabs');
  function renderText() {
    prints.forEach(function (fig) {
      var p = PHOTOS[fig.dataset.i];
      fig.querySelector('b').textContent = en() ? p.en : p.zh;
      fig.querySelector('i').textContent = p.en;
      fig.querySelector('.meta').textContent = themeName(p.theme);
      fig.querySelector('.mat').setAttribute('aria-label', (en() ? 'View photo: ' : '查看照片：') + (en() ? p.en : p.zh));
    });
    frames.forEach(function (f) {
      var p = PHOTOS[f.dataset.i];
      f.setAttribute('aria-label', (en() ? 'Go to print ' : '跳到第 ') + (Number(f.dataset.i) + 1) + (en() ? ': ' : ' 张：') + (en() ? p.en : p.zh));
    });
    tabs.innerHTML = THEMES.map(function (t) {
      var n = t.id === 'all' ? PHOTOS.length : PHOTOS.filter(function (p) { return p.theme === t.id; }).length;
      return '<button type="button" data-theme="' + t.id + '" aria-pressed="' + (t.id === current) + '">' + (en() ? t.en : t.zh) + '<sup>' + pad(n) + '</sup></button>';
    }).join('');
    tabs.setAttribute('aria-label', en() ? 'Filter by theme' : '按主题筛选');
    document.getElementById('sheet').setAttribute('aria-label', en() ? 'Contact sheet: thumbnails of nine photos' : '印样：九张照片的缩图');
  }
  renderText();
  Site.onLang(function () { renderText(); if (lightbox.open) showPhoto(cur, 0); });

  /* 筛选：先淡出，换排版，再淡入 */
  var motion = typeof gsap !== 'undefined' && !Site.calm;
  tabs.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b || b.dataset.theme === current) return;
    current = b.dataset.theme;
    all('button', tabs).forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
    function swap() {
      gallery.classList.toggle('filtered', current !== 'all');
      prints.forEach(function (fig) { fig.hidden = current !== 'all' && fig.dataset.theme !== current; });
      if (window.ScrollTrigger) ScrollTrigger.refresh();
      if (motion) gsap.fromTo(prints.filter(function (f) { return !f.hidden; }), { autoAlpha: 0, y: 40 }, { autoAlpha: 1, y: 0, duration: .9, stagger: .07, ease: 'expo.out' });
    }
    if (motion) gsap.to(gallery, { autoAlpha: 0, duration: .25, onComplete: function () { gsap.set(gallery, { autoAlpha: 1 }); swap(); } });
    else swap();
  });

  /* ---------- 大图 ---------- */
  var lightbox = document.getElementById('lightbox');
  var lbImg = document.getElementById('lbImg');
  var cur = 0;
  function visible() { return prints.filter(function (f) { return !f.hidden; }).map(function (f) { return Number(f.dataset.i); }); }
  function showPhoto(i, dir) {
    var list = visible();
    var pos = list.indexOf(i);
    if (pos < 0) { i = list[0]; pos = 0; }
    cur = i;
    var p = PHOTOS[i];
    lbImg.style.setProperty('--g', 'url(' + p.src + ') center/cover');
    lbImg.style.setProperty('--ar', p.ar);
    lbImg.setAttribute('aria-label', en() ? p.en : p.zh);
    document.getElementById('lbCount').innerHTML = pad(pos + 1) + '<small> / ' + pad(list.length) + '</small>';
    document.getElementById('lbTitle').textContent = en() ? p.en : p.zh;
    document.getElementById('lbSub').textContent = p.en;
    document.getElementById('lbTheme').textContent = themeName(p.theme);
    if (motion && dir) gsap.fromTo(lbImg, { autoAlpha: 0, x: dir * 40 }, { autoAlpha: 1, x: 0, duration: .55, ease: 'power3.out' });
  }
  function step(d) { var list = visible(); var pos = list.indexOf(cur); showPhoto(list[(pos + d + list.length) % list.length], d); }
  gallery.addEventListener('click', function (e) {
    var mat = e.target.closest('.mat');
    if (!mat) return;
    showPhoto(Number(mat.parentNode.dataset.i), 0);
    Site.openModal(lightbox);
  });
  gallery.addEventListener('keydown', function (e) {
    var mat = e.target.closest('.mat');
    if (mat && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); mat.click(); }
  });
  document.getElementById('lbPrev').addEventListener('click', function () { step(-1); });
  document.getElementById('lbNext').addEventListener('click', function () { step(1); });
  lightbox.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });
  document.getElementById('lbStage').addEventListener('click', function (e) { if (e.target === e.currentTarget) Site.closeModal(lightbox); });

  /* 点印样上的格子：圈起来，然后滑到展厅里那张 */
  frames.forEach(function (f) {
    f.addEventListener('click', function () {
      frames.forEach(function (x) { x.classList.toggle('picked', x === f); });
      setTimeout(function () { f.classList.remove('picked'); }, 1800);
      var i = Number(f.dataset.i);
      var fig = document.getElementById('print-' + (i + 1));
      if (fig.hidden) document.querySelector('#tabs [data-theme="all"]').click();
      setTimeout(function () {
        var y = fig.getBoundingClientRect().top + window.scrollY - 120;
        if (window.scrollY > 0 || true) Site.glideTo(y, 1.4);
      }, fig.hidden ? 400 : 0);
    });
  });

  if (!motion) return;
  gsap.registerPlugin(ScrollTrigger);

  /* 开场：标题从遮罩升起，三条底片依次滑进来，再自动圈一张 */
  var lines = Site.splitLines(document.querySelector('h1'));
  gsap.timeline({ defaults: { ease: 'expo.out' } })
    .from(lines, { yPercent: 110, duration: 1.5, stagger: .1 }, .2)
    .from('.kicker, .hero-line, .hero-hint', { autoAlpha: 0, y: 20, duration: 1.1, stagger: .1 }, .5)
    .from('.sheet', { autoAlpha: 0, x: 80, rotate: 2, duration: 1.6 }, .2)
    .from('.strip', { x: 60, autoAlpha: 0, duration: 1.2, stagger: .12 }, .5)

  /* 往下滑：红灯熄灭 */
  gsap.to('.safelight', { autoAlpha: 0, ease: 'none', scrollTrigger: { trigger: '.hall', start: 'top 95%', end: 'top 25%', scrub: true } });

  /* 显影：照片从一片泛白的相纸，慢慢浮出影像 */
  all('.mat .img').forEach(function (img, i) {
    gsap.set(img, { filter: 'brightness(2.6) contrast(0.25) saturate(0) sepia(0.6)' });
    ScrollTrigger.create({
      trigger: img, start: 'top 82%', once: true,
      onEnter: function () {
        gsap.to(img, { filter: 'brightness(1) contrast(1) saturate(1) sepia(0)', duration: 2.8 + (i % 3) * .4, ease: 'power2.out', clearProps: 'filter' });
      }
    });
  });
  prints.forEach(function (fig) {
    gsap.from(fig.querySelector('figcaption'), { autoAlpha: 0, y: 14, duration: 1.2, ease: 'expo.out', scrollTrigger: { trigger: fig, start: 'top 70%', once: true } });
    gsap.from(fig.querySelector('.mat'), { y: 70, duration: 1.6, ease: 'expo.out', scrollTrigger: { trigger: fig, start: 'top 95%', once: true } });
  });
  gsap.from('.hall-head', { autoAlpha: 0, y: 24, duration: 1.2, ease: 'expo.out', scrollTrigger: { trigger: '.hall', start: 'top 80%', once: true } });
})();
</script>
</body>
</html>
